server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent nginx from redirecting to http:// when behind reverse proxy
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|webp|svg|gif|ico|css|js|avif)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

